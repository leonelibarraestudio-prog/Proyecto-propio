<main class="awards-page">
  <header class="awards-header">
    <h1>Premios y estadísticas</h1>
    <p>Respuesta recibida del backend</p>
  </header>

  <p *ngIf="loading">Cargando respuesta...</p>

  <p *ngIf="!loading && error" class="awards-error">
    {{ error }}
  </p>

  <pre *ngIf="!loading && !error">{{ response | json }}</pre>
</main>
