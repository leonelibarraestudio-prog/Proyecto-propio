<main class="student-feature-shell">
  <h2>Historial</h2>

  <p *ngIf="viewModel.status === 'loading'">Cargando...</p>
  <p *ngIf="viewModel.status === 'error'">Error: {{ viewModel.error }}</p>
  <p *ngIf="viewModel.status === 'empty'">Todavía no hay batallas en el historial.</p>

  <pre>{{ viewModel.data | json }}</pre>
</main>
