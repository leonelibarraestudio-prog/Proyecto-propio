<main class="student-feature-shell">
  <h1>Fase Eliminatoria</h1>

  <p *ngIf="!data">Cargando datos...</p>

  <section *ngIf="data as knockout">
    <p><strong>Equipo:</strong> {{ knockout.teamId }}</p>
    <p><strong>Journey disponible:</strong> {{ knockout.journeyAvailable ? 'Sí' : 'No' }}</p>
    <p><strong>Cantidad de etapas:</strong> {{ knockout.stageCount }}</p>
    <p><strong>Cantidad de encuentros:</strong> {{ knockout.encounterCount }}</p>
  </section>
</main>
