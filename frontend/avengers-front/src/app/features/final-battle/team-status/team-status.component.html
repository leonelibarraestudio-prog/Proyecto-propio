<main class="student-feature-shell">
  <h1>Estado del Equipo</h1>
  <p *ngIf="pageState.status === 'loading'">
    Cargando estado de la Final...
  </p>
  <p *ngIf="pageState.status === 'error'">
    {{pageState.error}}
  </p>
  <pre *ngIf="pageState.status === 'data'">{{pageState.data | json}}</pre>
</main>
